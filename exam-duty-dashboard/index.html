*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}

h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;font-weight:600}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.top .title{display:flex;flex-direction:column;gap:6px}
.draft{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;width:fit-content}

/* picker */
.picker{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-block:-10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.picker label{font-weight:600}
.picker select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--accent);border-radius:10px;padding:9px 38px 9px 14px;min-width:0;width:min(420px,100%);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;cursor:pointer}
.picker select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-ghost{font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink-2);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}

/* who panel */
.who{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:18px;align-items:stretch}

.who-id{display:flex;flex-direction:column;gap:8px;justify-content:center}
.who-id .name{font-family:var(--font-display);font-size:clamp(22px,3vw,28px);font-weight:700;line-height:1.25}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:2px 8px;width:fit-content}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile .k{font-size:13px;color:var(--ink-2)}
.tile .v{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:600;color:var(--ink-2);margin-left:4px}
.tile .d{font-size:12.5px;color:var(--ink-3)}
.tile .d b{color:var(--ink-2);font-weight:600}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.panel-head p{margin:0;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);align-items:center}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.sw.proctor{background:var(--proctor)}.sw.dist{background:var(--dist)}.sw.opener{background:var(--opener)}
.sw.none{background:var(--empty);border:1px dashed var(--line)}
.sw.unav{background:repeating-linear-gradient(135deg,var(--ink-3) 0 1.5px,transparent 1.5px 5px)}

/* calendar strip */
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal{display:grid;grid-template-columns:62px repeat(var(--days),minmax(44px,1fr));gap:3px;min-width:calc(62px + var(--days) * 47px)}
.cal .ch{font-size:12px;text-align:center;color:var(--ink-2);line-height:1.25;padding-bottom:4px}
.cal .ch b{display:block;font-family:var(--font-display);font-size:16px;color:var(--ink);font-weight:600}
.cal .ch.we{color:var(--warn-ink)} .cal .ch.we b{color:var(--warn-ink)}
.cal .rh{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;justify-content:center;line-height:1.2}
.cal .rh b{color:var(--ink);font-weight:600;font-size:13px}
.cell{height:48px;border-radius:6px;background:var(--empty);position:relative;display:flex;flex-direction:column;gap:2px;align-items:stretch;justify-content:center;padding:3px;font-size:11.5px;font-weight:600;color:#fff;cursor:default}
.cell.noexam{background:transparent;border:1px dashed var(--line-soft)}
.cell.exam{background:var(--surface-2)}
.cell.we.noexam{background:var(--weekend);border-color:transparent}
.cell .bar{flex:1;border-radius:3px;display:flex;align-items:center;justify-content:center;min-height:0;line-height:1}
.cell .bar.proctor{background:var(--proctor)}.cell .bar.dist{background:var(--dist)}.cell .bar.opener{background:var(--opener)}
.cell.heat{color:var(--ink);font-family:var(--font-display);font-size:15px;align-items:center}
.cell.unav::after{content:"";position:absolute;inset:0;border-radius:6px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ink-3) 55%,transparent) 0 1.5px,transparent 1.5px 6px);pointer-events:none}
.cell[data-tip]{cursor:help}

/* weekday heatmap */
.hm{display:grid;grid-template-columns:52px repeat(7,minmax(34px,1fr));gap:3px}
.hm .ch{font-size:12.5px;text-align:center;color:var(--ink-2)}
.hm .ch.we{color:var(--warn-ink)}
.hm .rh{font-size:12px;color:var(--ink-2);display:flex;align-items:center}
.hcell{height:44px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1;gap:3px;font-variant-numeric:tabular-nums}
.hcell .plus{font-family:var(--font-body);font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:999px;background:var(--surface);color:var(--ink)}
.ramp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.ramp i{display:inline-block;width:18px;height:10px;border-radius:2px}

/* period mix */
.mix{display:flex;flex-direction:column;gap:12px}
.mixrow{display:grid;grid-template-columns:78px minmax(0,1fr);gap:10px;align-items:center;font-size:13px}
.mixbar{display:flex;height:26px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface)}
.mixbar span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.mixbar .P1{background:var(--p1);color:#0d2a4f}.mixbar .P2{background:var(--p2)}.mixbar .P3{background:var(--p3)}
.sw.P1{background:var(--p1)}.sw.P2{background:var(--p2)}.sw.P3{background:var(--p3)}
.insight{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin:0}

/* table */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.dayhead td{background:var(--surface-2);font-family:var(--font-display);font-weight:600;font-size:14.5px;padding:7px 10px;border-bottom:none}
tr.dayhead.we td{background:var(--weekend)}
tr.me td{background:var(--accent-soft)}
.role{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.role::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.role.proctor,.role.own{--c:var(--proctor)}.role.dist{--c:var(--dist)}.role.opener{--c:var(--opener)}
.course b{font-family:var(--font-mono);font-weight:500}
.course .cn{display:block;color:var(--ink-2);font-size:13px}
.ppl{color:var(--ink-2);font-size:13.5px}
.ppl .mine{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 4px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 12px;font-size:14px}
.empty-note{padding:18px;text-align:center;color:var(--ink-2);background:var(--surface-2);border-radius:10px}
.table-wrap{overflow-x:auto;max-height:none}
@media (max-width:640px){
  table.cards thead{display:none}

  table.cards td[data-l]::before{content:attr(data-l) " ";color:var(--ink-3);font-size:12px}

.load{display:flex;flex-direction:column;gap:3px}
.lrow{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 28px;gap:10px;align-items:center;font-size:13px;border-radius:6px;padding:1px 4px;cursor:pointer;background:none;border:0;font:inherit;color:inherit;text-align:left;width:100%}

.axis .ticks{position:relative;height:16px}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.gridlines{position:absolute;inset:0;pointer-events:none}

.top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:10px}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}

</style>

  h += `<optgroup label="${t('grpStaff')} (${staff.length})">` + [...staff].sort(sortTh).map(p => {
    const tag = extraTag(p);
    return opt(p.id, shortName(p) + (tag ? ` · ${tag}` : ''));
  }).join('') + '</optgroup>';
  h += `<optgroup label="${t('grpTeach')} (${teachers.length})">` + [...teachers].sort(sortTh).map(p => opt(p.id, shortName(p))).join('') + '</optgroup>';
  sel.innerHTML = h;
  sel.value = current;
}

// ---------- calendar ----------
function renderCal(){
  const days = DATA.days, w = W(), en = EN();
  const cal = document.getElementById('cal');
  cal.style.setProperty('--days', days.length);
  const examCells = {};
  DATA.slots.forEach(s => (examCells[s.date+'|'+s.p] ||= []).push(s.time));
  const mine = current !== 'all';
  const p = byId[current];
  document.getElementById('calTitle').textContent = mine ? (en?'My duty calendar':'ปฏิทินเวรของท่านในรอบนี้') : (en?'Exam calendar: staff required per session':'ปฏิทินการสอบ: จำนวนพนักงานที่ต้องใช้ในแต่ละช่วง');
  document.getElementById('calLegend').innerHTML = mine
    ? `<span><i class="sw proctor"></i>${p.kind==='teacher'?w.role.own:w.role.proctor}</span>${p.kind==='staff'?`<span><i class="sw dist"></i>${w.role.dist}</span><span><i class="sw opener"></i>${w.role.opener}</span>`:''}<span><i class="sw none"></i>${en?'Exam, no duty for you':'มีการสอบ แต่ไม่มีเวรของท่าน'}</span>${unavBy[current]?`<span><i class="sw unav"></i>${en?'Reported unavailable':'วันที่แจ้งไม่สะดวก'}</span>`:''}`
    : `<span class="ramp">${en?'Fewer':'น้อย'} ${[1,2,3,4,5,6].map(i=>`<i style="background:var(--s${i})"></i>`).join('')} ${en?'More':'มาก'}</span><span>${en?'Number = staff duties in that session':'ตัวเลข = จำนวนเวรของพนักงานในช่วงนั้น'}</span>`;
  let h = '<div></div>' + days.map(d => { const o=dObj(d); return `<div class="ch${isWE(d)?' we':''}">${w.dow[o.getDay()]}<b>${o.getDate()}</b>${o.getDate()===1||d===days[0]?w.mon[o.getMonth()]:''}</div>`; }).join('');
  const counts = {};
  staffDuties.forEach(d => { const k=d.date+'|'+d.p; counts[k]=(counts[k]||0)+1; });
  const maxC = Math.max(...Object.values(counts));
  const myD = mine ? (dutiesBy[current]||[]) : [];
  PERIODS.forEach(per => {
    h += `<div class="rh"><b>${perName(per.p)}</b>${per.p} · ${per.t}</div>`;
    days.forEach(d => {
      const key = d+'|'+per.p, has = examCells[key];
      const we = isWE(d) ? ' we' : '';
      const un = mine && unavBy[current]?.has(d) ? ' unav' : '';
      if (!has){ h += `<div class="cell noexam${we}${un}"></div>`; return; }
      if (mine){
        const ds = myD.filter(x => x.date===d && x.p===per.p);
        if (!ds.length){ h += `<div class="cell exam${we}${un}" data-tip="${esc(dayShort(d)+' '+perName(per.p)+' ('+has.join(', ')+')<br>'+(en?'Exam scheduled, no duty for you':'มีการสอบ แต่ไม่มีเวรของท่าน'))}"></div>`; return; }
        const roles = [...new Set(ds.map(x => x.role==='own'?'proctor':x.role))];
        const tipTxt = `<b>${dayShort(d)} · ${perName(per.p)}</b><br>` + ds.map(x => `${w.role[x.role]} ${x.time}${x.room?' · '+esc(roomText(x.room)):''}`).join('<br>');
        h += `<div class="cell${we}${un}" data-tip="${esc(tipTxt)}">${roles.map(r => `<div class="bar ${r}">${w.roleShort[r]}</div>`).join('')}</div>`;
      } else {
        const c = counts[key]||0;
        const lvl = c ? Math.min(7, 1 + Math.round((c/maxC)*5)) : 0;
        const ink = lvl >= 4 ? 'color:#fff' : '';
        const rooms = has.reduce((n,tm) => n + roomsAt(d,tm).length, 0);
        h += `<div class="cell heat${we}" style="background:${lvl?`var(--s${lvl})`:'var(--surface-2)'};${ink}" data-tip="${esc(`<b>${dayShort(d)} · ${perName(per.p)}</b><br>${has.join(', ')}<br>${rooms} ${w.rooms} · ${en?'staff':'พนักงาน'} ${c} ${w.people}`)}">${c||''}</div>`;
      }
    });
  });
  cal.innerHTML = h;
}

// ---------- weekday x period heatmap ----------
function renderHM(){
  const hm = document.getElementById('hm'), row = document.getElementById('distRow'), w = W(), en = EN();
  const p = byId[current];
  if (current !== 'all' && (p.kind === 'teacher' || !p.after)){ row.hidden = true; return; }
  row.hidden = false;
  let vals, adds, title, sub;
  if (current === 'all'){
    vals = Array(21).fill(0); adds = null;
    staffDuties.forEach(d => { const i = STACK_IDX.indexOf(dow(d.date)); vals[i*3 + (+d.p[1]-1)]++; });
    title = en ? 'This round by weekday and session' : 'การกระจายเวรในรอบนี้ตามวันและช่วงเวลา';
    sub = en ? 'All staff duties this round, by day of the week and session.' : 'รวมเวรของพนักงานทั้งหมดในรอบนี้ แยกตามวันในสัปดาห์และช่วงเวลา';
  } else {
    vals = p.after; adds = p.after.map((v,i) => v - (p.before?.[i]||0));
    title = en ? 'My cumulative duties by weekday' : 'เวรสะสมของท่านตามวันในสัปดาห์';
    sub = en ? 'Large numbers are cumulative counts (earlier rounds plus this round); +n marks duties added this round. The roster uses these counts to avoid giving anyone the same slot repeatedly.'
             : 'ตัวเลขหลักคือจำนวนครั้งสะสม (รอบก่อนหน้ารวมรอบนี้) ป้าย +n คือจำนวนที่เพิ่มในรอบนี้ ระบบใช้ตัวเลขดังกล่าวเพื่อไม่ให้ผู้ใดได้รับช่วงเวลาเดิมซ้ำ';
  }
  document.getElementById('hmTitle').textContent = title;
  document.getElementById('hmSub').textContent = sub;
  const max = Math.max(1, ...vals);
  let h = '<div></div>' + STACK_IDX.map((di,i) => `<div class="ch${i>=5?' we':''}">${w.dow[di]}</div>`).join('');
  PERIODS.forEach((per, pi) => {
    h += `<div class="rh">${perName(per.p)}</div>`;
    STACK_IDX.forEach((di, i0) => {
      const i = i0*3 + pi, v = vals[i];
      const lvl = v ? Math.min(7, 1 + Math.round((v/max)*6)) : 0;
      const ink = lvl >= 4 ? '#fff' : 'var(--ink)';
      const a = adds && adds[i] > 0 ? `<span class="plus">+${adds[i]}</span>` : '';
      const lab = `<b>${w.dow[di]} ${perName(per.p)}</b><br>`;
      const tt = adds ? lab + (en ? `Cumulative ${v}${adds[i]>0?` (this round +${adds[i]})`:''}` : `สะสม ${v} ครั้ง${adds[i]>0?` (รอบนี้ +${adds[i]})`:''}`)
                      : lab + (en ? `${v} duties this round` : `${v} เวรในรอบนี้`);
      h += `<div class="hcell" style="background:${lvl?`var(--s${lvl})`:'var(--empty)'};color:${ink}" data-tip="${esc(tt)}">${v||'<span style="color:var(--ink-3);font-weight:400">·</span>'}${a}</div>`;
    });
  });
  hm.innerHTML = h;
  document.getElementById('ramp').innerHTML = `0 ${[1,2,3,4,5,6,7].map(i=>`<i style="background:var(--s${i})"></i>`).join('')} ${max} ${w.times}`;

  const teamP = {P1:0,P2:0,P3:0}; staffDuties.forEach(d => teamP[d.p]++);
  const bar = (obj, label) => {
    const tot = obj.P1+obj.P2+obj.P3 || 1;
    return `<div class="mixrow"><span>${label}</span><div class="mixbar">${PERIODS.map(per => { const v=obj[per.p]; const pc=Math.round(v/tot*100); return v?`<span class="${per.p}" style="flex:${v}" data-tip="${esc(`${label} · ${perName(per.p)}: ${v} ${w.duties} (${pc}%)`)}">${pc>=12?pc+'%':''}</span>`:''; }).join('')}</div></div>`;
  };
  const leg = `<div class="legend">${PERIODS.map(per=>`<span><i class="sw ${per.p}"></i>${perName(per.p)} (${per.p})</span>`).join('')}</div>`;
  const mix = document.getElementById('mix');
  const allLabel = en ? 'All staff' : 'ภาพรวม';
  if (current === 'all'){
    const top = PERIODS.reduce((a,b)=>teamP[a.p]>=teamP[b.p]?a:b);
    mix.innerHTML = leg + bar(teamP, allLabel) + `<p class="insight">${en?`Most duties this round fall in the ${perName(top.p).toLowerCase()} session. A larger share in this session is expected given the workload.`:`เวรในรอบนี้ส่วนใหญ่อยู่ในช่วง${perName(top.p)} หากเวรของท่านอยู่ในช่วงนี้มาก ถือเป็นไปตามสัดส่วนของงาน`}</p>`;
    return;
  }
  const me = {P1:0,P2:0,P3:0}; (dutiesBy[current]||[]).forEach(d => me[d.p]++);
  const myTot = me.P1+me.P2+me.P3;
  let insight;
  if (!myTot) insight = en ? 'No duties this round.' : 'ไม่มีเวรในรอบนี้';
  else {
    const teamTot = teamP.P1+teamP.P2+teamP.P3;
    const top = PERIODS.map(per => ({per, d: me[per.p]/myTot - teamP[per.p]/teamTot})).reduce((a,b) => b.d > a.d ? b : a);
    insight = top.d > 0.2
      ? (en ? `Your duties fall in the <b>${perName(top.per.p).toLowerCase()}</b> session ${Math.round(top.d*100)} points more than the overall share.`
            : `เวรของท่านอยู่ในช่วง<b>${perName(top.per.p)}</b>มากกว่าสัดส่วนภาพรวม ${Math.round(top.d*100)} จุด`)
      : (en ? 'Your session mix is close to the overall workload; your duties are not concentrated in one session.'
            : 'สัดส่วนช่วงเวลาของท่านใกล้เคียงกับภาพรวม เวรไม่ได้กระจุกอยู่ในช่วงใดช่วงหนึ่ง');
  }
  mix.innerHTML = leg + bar(me, en?'Mine':'ของท่าน') + bar(teamP, allLabel) + `<p class="insight">${insight}</p>`;
}

}

const pendingMoveTag = () => `<span class="pending">${EN() ? 'Proctor to be reassigned from the Economics team (name TBA)' : 'รอมอบหมายผู้คุม 1 ท่านจากทีมคณะเศรษฐศาสตร์ (แจ้งชื่อภายหลัง)'}</span>`;

      room = roomsList.map(r => bldgOfRoom(r)==='EC' ? esc(roomText(r)) : `<span class="mono">${esc(r)}</span>`).join(', ');

      const uniq = [...new Set(dayRooms.map(r=>r.room))];

      room = `<span class="mono">${esc(uniq.join(', '))}</span>`;
      const dist = [...new Set(DATA.duties.filter(x=>x.date===d.date&&x.role==='dist').map(x=>byId[x.pid].name))];
      ppl = `${en?'Distribution today':'ผู้จ่ายข้อสอบวันนี้'}: ${namesHtml(dist)}`;
    }
    h += `<tr><td data-l="${H[0]}">${dayShort(d.date)}</td><td data-l="${H[1]}" class="num">${time}</td><td data-l="${H[2]}"><span class="role ${d.role}">${w.role[d.role]}</span></td><td data-l="${H[3]}">${course}</td><td data-l="${H[4]}">${room}</td><td data-l="${H[5]}" class="num">${n||''}</td><td data-l="" class="ppl">${ppl}</td></tr>`;
  });
  el.innerHTML = h + '</tbody></table>';
}
function renderTeamTable(){
  const el = document.getElementById('tbl'), w = W(), en = EN();
  document.getElementById('tblTitle').textContent = en ? 'Full exam duty schedule' : 'ตารางเวรคุมสอบทั้งหมด';
  const entries = Object.entries(DATA.rooms).map(([k,v]) => { const [date,time,room] = k.split('|'); return {date,time,room,es:v}; })
    .sort((a,b) => (a.date+a.time+a.es[0].code+a.es[0].sec).localeCompare(b.date+b.time+b.es[0].code+b.es[0].sec));
  const H = en ? ['Time','Course / Section','Room','Students','Proctors','Distribution · Room opening'] : ['เวลา','วิชา / ตอน','ห้อง','นศ.','ผู้คุมสอบ','ผู้จ่ายข้อสอบ · ผู้เปิดห้อง'];
  let h = `<table class="cards"><thead><tr><th>${H[0]}</th><th>${H[1]}</th><th>${H[2]}</th><th class="num">${H[3]}</th><th>${H[4]}</th><th>${H[5]}</th></tr></thead><tbody>`;
  let last='';
  entries.forEach(r => {
    if (r.date !== last){ h += `<tr class="dayhead${isWE(r.date)?' we':''}"><td colspan="6">${dayLong(r.date)}</td></tr>`; last = r.date; }
    const inRoom = peopleAtRoom(r.date, r.time, r.room).map(x => byId[x.pid]);
    const tch = inRoom.filter(x => x.kind==='teacher').map(x=>x.name);
    const s = inRoom.filter(x => x.kind==='staff').map(x=>x.name);
    r.es.forEach(e => { if (e.distHelp) s.push(e.distHelp); });
    const pending = unstaffedKey.has(`${r.date}|${r.time}|${r.room}`);
    const dist = distFor(r.date, r.time, r.room);
    h += `<tr><td data-l="${H[0]}" class="num">${r.time}</td><td data-l="${H[1]}">${courseHtml(r.es)}</td><td data-l="${H[2]}">${roomLabel(r.room)}</td><td data-l="${H[3]}" class="num">${r.es.reduce((a,e)=>a+(e.n||0),0)}</td>
      <td data-l="${H[4]}" class="ppl">${pending ? pendingMoveTag() : ''}${tch.map(x=>esc(x)).join(', ')}${tch.length&&s.length?' – ':''}${s.length ? namesHtml([...new Set(s)]) : (tch.length||pending ? '' : '—')}</td>
      <td data-l="${H[5]}" class="ppl">${namesHtml(dist)} · ${namesHtml(dayOpener(r.date).map(x=>x.name))}</td></tr>`;
  });
  el.innerHTML = h + '</tbody></table>';
}

// ---------- load chart ----------
function renderLoad(){
  const el = document.getElementById('load'), w = W(), en = EN();
  const rows = staff.map(p => ({p, st: personStats(p.id)})).filter(r => r.st.total > 0)
    .sort((a,b) => b.st.total - a.st.total || shortName(a.p).localeCompare(shortName(b.p),'th'));
  const max = Math.max(...rows.map(r => r.st.total));
  const ticks = Array.from({length:max+1},(_,i)=>i);
  el.classList.toggle('focus', current !== 'all' && byId[current].kind === 'staff');
  el.innerHTML = rows.map(({p, st}) => {
    const b = st.byRole;
    const seg = ['proctor','dist','opener'].filter(r => b[r]).map(r => `<span class="${r}" style="width:calc(${b[r]/max*100}% - 2px)" data-tip="${esc(`${shortName(p)}<br>${w.role[r]} ${b[r]} ${w.duties}`)}"></span>`).join('');
    return `<button type="button" class="lrow${p.id===current?' sel':''}" data-id="${p.id}"><span class="ln">${esc(shortName(p))}</span><span class="lb">${seg}</span><span class="lv">${st.total}</span></button>`;
  }).join('') + `<div class="axis"><span></span><span class="ticks">${ticks.map(x=>`<span style="left:${x/max*100}%">${x}</span>`).join('')}</span><span></span></div>` +
  `<p class="small muted" style="margin:6px 0 0">${en ? `Median ${teamMedian} duties per person · base cap ${DATA.summary.cap} duties (room openers count one duty per day and may exceed the cap).`
                                                     : `ค่ากลาง ${teamMedian} เวรต่อคน · เพดานพื้นฐาน ${DATA.summary.cap} เวร (ผู้เปิดห้องนับวันละ 1 เวร จึงอาจเกินเพดาน)`}</p>`;
  el.querySelectorAll('.lrow').forEach(b => b.addEventListener('click', () => { select(b.dataset.id); document.getElementById('whoPanel').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'}); }));
}

  document.documentElement.lang = lang;

  document.getElementById('lang-th').setAttribute('aria-pressed', String(!EN()));
  document.getElementById('lang-en').setAttribute('aria-pressed', String(EN()));
  document.getElementById('roleLegend1').innerHTML = roleLegend();
  document.getElementById('roleLegend2').innerHTML = roleLegend();
  const last = dObj(DATA.days.at(-1));
  document.getElementById('roundLabel').textContent = EN()
    ? `Final examinations · ${dayShort(DATA.days[0])} – ${dayShort(DATA.days.at(-1))} ${last.getFullYear()}`
    : `รอบ ${DATA.round} · สอบ ${dayShort(DATA.days[0])} – ${dayShort(DATA.days.at(-1))} ${last.getFullYear()+543}`;
  document.getElementById('foot').innerHTML = EN()
    ? `<span>This roster is a draft and has not yet been confirmed. If an assignment conflicts with an essential commitment, please inform the roster administrator before the official announcement.</span><span>Cumulative duties include the 2/2025 final, the 1/2026 midterm and the English midterm/final exams, plus this round.</span>`
    : `<span>ตารางนี้เป็นฉบับร่างและยังไม่ได้รับการยืนยัน หากเวรที่ได้รับมอบหมายตรงกับภารกิจที่จำเป็น โปรดแจ้งผู้ดูแลตารางก่อนการประกาศอย่างเป็นทางการ</span><span>เวรสะสมนับรวมรอบปลายภาค 2/2568 กลางภาค 1/2569 และการคุมสอบภาษาอังกฤษ (กลางภาค/ปลายภาค) กับรอบนี้</span>`;
  buildPicker();
}

function render(){
  renderNotice(); renderWho(); renderCal(); renderHM();
  current === 'all' ? renderTeamTable() : renderMyTable();
  renderLoad();
}
function setLang(l){
  lang = l;
  try { localStorage.setItem('exam-duty-lang', l); } catch(e){}
  renderStatic(); render();
}
document.getElementById('lang-th').addEventListener('click', () => setLang('th'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

let saved = 'all';
try { saved = localStorage.getItem('exam-duty-who') || 'all'; } catch(e){}
current = byId[saved] ? saved : 'all';
renderStatic();
select(current);
</script>
